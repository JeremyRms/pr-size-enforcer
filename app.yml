# GitHub App manifest for pr-size-enforcer

name: PR Size Enforcer
description: Fails a pull request check when a PR exceeds a configurable size threshold
url: https://github.com/JeremyRms/pr-size-enforcer
author: Jeremy Lamit

permissions:
  checks: write
  contents: read
  pull_requests: read

events:
  - pull_request

public: false
redirect_url: https://pr-size-enforcer.onrender.com/
webhook_active: true
